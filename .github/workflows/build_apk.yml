name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Hard Reset Android Directory
        run: |
          rm -rf android
          flutter create . --platforms=android

      - name: Build APK & Log Output
        run: |
          flutter build apk --release 2>&1 | tee build_output.log

      - name: Generate Error Log File
        if: failure()
        run: |
          echo "==================================================" > error_log.txt
          echo "      PEŁNY RAPORT BŁĘDU KOMPILACJI APK           " >> error_log.txt
          echo "==================================================" >> error_log.txt
          echo "" >> error_log.txt
          echo "--- WYKRYTE LINIJKI Z BŁĘDAMI ---" >> error_log.txt
          grep -i -E "error|failure|exception|failed" build_output.log >> error_log.txt || true
          echo "" >> error_log.txt
          echo "--- OSTATNIE 100 LINIJEK LOGU SYSTEMOWEGO ---" >> error_log.txt
          tail -n 100 build_output.log >> error_log.txt

      - name: Upload Error Log (When Failed)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: error-log-txt
          path: error_log.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
